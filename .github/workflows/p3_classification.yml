name: P3 classification

on:
  workflow_run:
    workflows: ["Collecte"]  
    types: [completed]
  workflow_dispatch:

# Même groupe que la collecte : jamais deux workflows qui écrivent le CSV en même temps
concurrency:
  group: veille-csv
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  p3:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests rapidfuzz trafilatura

      # Le script 06_classifier.py utilise re_extraire() depuis commun.py
      # pour re-télécharger les textes manquants (data/textes/<id>.txt).
      # trafilatura est installé ci-dessus pour que re_extraire fonctionne.

      - name: Classification
        env:
          LLM_FOURNISSEUR: gemini
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_MODELE: gemini-2.5-flash
        run: python scripts/06_classifier.py --csv data/articles.csv --limite 60

      - name: Notabilité
        if: ${{ !cancelled() }}
        run: python scripts/08_notabilite.py --csv data/articles.csv

      - name: Commit du CSV
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/articles.csv
          git diff --cached --quiet && exit 0
          git commit -m "P3 : classification, notabilité"
          git pull --rebase origin main
          git push