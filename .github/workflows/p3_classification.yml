name: P3 classification

on:
  push:
    paths:
      - "scripts/06_classifier.py"
      - "config/prompt_classification.txt"
      - ".github/workflows/p3_classification.yml"
  workflow_run:
    workflows: ["Collecte"]  
    types: [completed]
  workflow_dispatch:
    inputs:
      refaire:
        description: "Réannoter tous les articles déjà classés (sans limite de 60)"
        required: false
        type: boolean
        default: false

# Même groupe que la collecte : jamais deux workflows qui écrivent le CSV en même temps
concurrency:
  group: veille-csv
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  p3:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restauration du cache des textes extraits
        uses: actions/cache@v4
        with:
          path: data/textes
          key: data-textes-${{ github.run_id }}
          restore-keys: |
            data-textes-

      - name: Classification
        env:
          LLM_FOURNISSEUR: gemini
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_MODELE: gemini-3.5-flash-lite
          REANNOTER: ${{ inputs.refaire || (github.event_name == 'push' && contains(github.event.head_commit.message, '[reannotate]')) }}
        run: |
          if [[ "$REANNOTER" == "true" ]]; then
            python scripts/06_classifier.py --csv data/articles.csv --refaire
          else
            python scripts/06_classifier.py --csv data/articles.csv --limite 60
          fi

      - name: Notabilité
        if: ${{ !cancelled() }}
        run: python scripts/08_notabilite.py --csv data/articles.csv

      - name: Export JSON pour le site
        if: ${{ !cancelled() }}
        run: python scripts/09_export_site.py

      - name: Commit du CSV
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/articles.csv site/src/data/articles.json
          git diff --cached --quiet && exit 0
          git commit -m "P3 : classification, notabilité"
          git pull --rebase origin main
          git push
