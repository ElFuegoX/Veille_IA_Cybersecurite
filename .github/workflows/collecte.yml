name: Collecte

on:
  schedule:
    - cron: "0 6,18 * * *"   # 2 fois par jour (heure UTC)
  workflow_dispatch:          # lancement manuel possible

# Une seule exécution à la fois : même groupe que p3_classification.yml
# pour qu'aucun workflow n'écrive le CSV pendant qu'un autre le fait
concurrency:
  group: veille-csv
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Collecte des flux
        run: python scripts/01_collecte.py

      # 60 articles par run. Les textes écrits dans data/textes/<id>.txt
      # restent disponibles pour 04_qualite.py dans CE job.
      # Pour les articles anciens, 04_qualite.py re-télécharge via re_extraire().
      - name: Extraction des articles (60 par exécution)
        run: python scripts/02_extraction.py --limite 60

      # Sans clé API : règles seules. Avec clé : l'IA affine exactitude/objectif.
      - name: Notes CRAAP
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/04_qualite.py

      - name: Comptage des reprises d'une même histoire
        run: python scripts/03_reprises.py

      # Le texte complet (data/textes/) n'est jamais commité : voir .gitignore
      # La classification P3 tourne dans un workflow séparé (p3_classification.yml)
      - name: Enregistrement du CSV
        run: |
          git config user.name "veille-bot"
          git config user.email "veille-bot@users.noreply.github.com"
          git add data/articles.csv
          if git diff --cached --quiet; then
            echo "Aucun changement."
          else
            git commit -m "Collecte automatique $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase
            git push
          fi
