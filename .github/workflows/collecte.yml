name: Collecte

on:
  schedule:
    - cron: "0 6,18 * * *"   # 2 fois par jour (heure UTC)
  workflow_dispatch:          # lancement manuel possible

# Une seule exécution à la fois (évite les écritures simultanées du CSV)
concurrency:
  group: collecte
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Collecte des flux
        run: python scripts/01_collecte.py

      - name: Extraction des articles (60 par exécution)
        run: python scripts/02_extraction.py --limite 60

      # Juste après l'extraction : les textes (data/textes/) n'existent que pendant ce job.
      # Sans secret GROQ_API_KEY (ou GEMINI_API_KEY), les règles seules sont utilisées.
      - name: Notes CRAAP
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/04_qualite.py

      - name: Comptage des reprises d'une même histoire
        run: python scripts/03_reprises.py

      - name: Export JSON pour le site
        run: python scripts/09_export_site.py

      # Le texte complet (data/textes/) n'est jamais commité : voir .gitignore
      - name: Enregistrement du CSV
        run: |
          git config user.name "veille-bot"
          git config user.email "veille-bot@users.noreply.github.com"
          git add data/articles.csv site/src/data/articles.json
          if git diff --cached --quiet; then
            echo "Aucun changement."
          else
            git commit -m "Collecte automatique $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase
            git push
          fi
