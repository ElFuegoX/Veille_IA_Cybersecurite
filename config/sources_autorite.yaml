# Sources reconnues pour le critère Autorité du CRAAP (P2, tâche 2.3).
# Utilisé par scripts/04_qualite.py.
#
# Note d'autorité d'un article :
#   2 = auteur identifié ET source de catégorie « plafond 2 »
#   1 = source identifiée sans auteur, ou source de catégorie « plafond 1 » (blog, éditeur...)
#   0 = anonyme, source inconnue (absente de ce fichier) ou catégorie « plafond 0 »
#
# Chaque entrée est soit un domaine (sous-domaines compris : « paloaltonetworks.com »
# couvre « unit42.paloaltonetworks.com »), soit un nom de média tel qu'il apparaît
# dans la colonne « source » (Google Actualités donne le nom, pas le domaine).
# La casse et la ponctuation des noms sont ignorées.
#
# Les sources inconnues sont listées à la fin de chaque exécution du script :
# les ajouter ici (dans la bonne catégorie) puis relancer avec --refaire.

# Domaines publics reconnus automatiquement comme « institution » (fin du domaine)
suffixes_institution:
  - .gov
  - .gouv.fr
  - .gov.uk
  - .gov.au
  - .gov.wales
  - .europa.eu
  - .edu
  - .ac.uk
  - .int

